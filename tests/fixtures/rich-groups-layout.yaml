# S4-L2-Positiv-Fixture (R-36): cmi-ähnliche 5-Gruppen-Topologie —
# KEINE explizite Komponente-`at` (nur die Makro-Boxen tragen at/size).
# Die Mikro-Layout-Engine (layout.resolve) platziert alle Mitglieder
# deterministisch in ihre Boxen (hub-zentriert, Spalten-Split,
# Port-Ortungs-Refinement) → rendert gruppen-kompakt, check exit 0.
#
# Engine-Layout (R-36; Canvas 1400×900):
#   g_kessel      60..440   × 80..400    → hub b_oil (250,240),
#                                          chim (166,240), b_wood (334,240)
#   g_kollektor   60..480   × 480..720   → hub coll1 (270,600),
#                                          coll2 (178,600)
#   g_puffer      540..900  × 300..600   → hub puffer (720,450),
#                                          mix1 (641,450), mix2 (799,450)
#   g_heizkreis   980..1340 × 80..380    → hub rad1 (1160,230),
#                                          rad2 (1081,230), rad3 (1239,230)
#   g_warmepumpe  980..1340 × 480..720   → hub pum1 (1160,600),
#                                          val1 (1081,600), th1 (1239,600)
# (via-Routen: Manhattan-Fallback würde durch Symbole/Texte laufen.)
schema: plantschema/v1
canvas: { width: 1400, height: 900, background: "#0b1220" }

components:
  # --- Puffer-Gruppe (hub-Zentrum) ---
  - id: puffer
    type: tank-buffer
    label: { text: "Puffer P", sub: "1000 L" }
  - id: mix1
    type: mixing
    label: { text: "M1" }
  - id: mix2
    type: mixing
    label: { text: "M2" }
  # --- Kessel-Gruppe ---
  - id: b_oil
    type: boiler-oil
    label: { text: "H2 · Öl" }
  - id: b_wood
    type: boiler-solid
    label: { text: "B2 · Holz" }
  - id: chim
    type: chimney
    label: { text: "Kamin" }
  # --- Kollektor-Gruppe ---
  - id: coll1
    type: collector-solar
    label: { text: "K1" }
  - id: coll2
    type: collector-solar
    label: { text: "K2" }
  # --- Heizkreis-Gruppe ---
  - id: rad1
    type: radiator
    label: { text: "R1" }
  - id: rad2
    type: radiator
    label: { text: "R2" }
  - id: rad3
    type: radiator
    label: { text: "R3" }
  # --- Wärmetauscher-Gruppe ---
  - id: pum1
    type: pump
    label: { text: "P1" }
  - id: val1
    type: valve-2way
    label: { text: "V1" }
  - id: th1
    type: throttle
    label: { text: "T1" }

groups:
  - id: g_puffer
    label: "Puffer"
    members: [puffer, mix1, mix2]
    hub: puffer
    at: [540, 300]
    size: [360, 300]
  - id: g_kessel
    label: "Kessel"
    members: [b_oil, b_wood, chim]
    hub: b_oil
    at: [60, 80]
    size: [380, 320]
  - id: g_kollektor
    label: "Kollektor"
    members: [coll1, coll2]
    hub: coll1
    at: [60, 480]
    size: [420, 240]
  - id: g_heizkreis
    label: "Heizkreis"
    members: [rad1, rad2, rad3]
    hub: rad1
    at: [980, 80]
    size: [360, 300]
  - id: g_warmepumpe
    label: "Wärmepumpe"
    members: [pum1, val1, th1]
    hub: pum1
    at: [980, 480]
    size: [360, 240]

pipes:
  # Vorlauf: Öl-/Holzkessel → Puffer, Abgas: Öl-Kessel → Kamin.
  - id: p_boil1
    from: { comp: b_oil, port: right }
    to: { comp: puffer, port: left }
    kind: vl
    via: [[278, 300], [680, 300], [680, 450]]
  - id: p_boil2
    from: { comp: b_wood, port: right }
    to: { comp: puffer, port: mid-bottom }
    kind: vl
    via: [[362, 470], [720, 470]]
  - id: p_gas
    from: { comp: b_oil, port: top }
    to: { comp: chim, port: left }
    kind: gas
  # Solar: Kollektoren → Mischventile → Puffer/Pumpe.
  - id: p_solar
    from: { comp: coll1, port: out }
    to: { comp: mix1, port: in }
    kind: vl
    via: [[311, 660], [627, 660]]
  - id: p_solar2
    from: { comp: coll2, port: out }
    to: { comp: mix2, port: in }
    kind: vl
  - id: p_misch
    from: { comp: mix1, port: out }
    to: { comp: puffer, port: mid-top }
    kind: vl
  - id: p_pump
    from: { comp: mix2, port: out }
    to: { comp: pum1, port: in }
    kind: vl
  # Kreislauf: Pumpe → Ventil → Drossel → Heizkreise → Rücklauf.
  - id: p_valve
    from: { comp: pum1, port: out }
    to: { comp: val1, port: in }
    kind: vl
  - id: p_throttle
    from: { comp: val1, port: out }
    to: { comp: th1, port: in }
    kind: vl
  - id: p_rad
    from: { comp: th1, port: out }
    to: { comp: rad1, port: in }
    kind: vl
    via: [[1259, 420], [1130, 420]]
  - id: p_loop1
    from: { comp: rad1, port: out }
    to: { comp: rad2, port: in }
    kind: rl
  - id: p_loop2
    from: { comp: rad2, port: out }
    to: { comp: rad3, port: in }
    kind: rl
  - id: p_ret
    from: { comp: rad3, port: out }
    to: { comp: puffer, port: bottom }
    kind: rl
    via: [[1300, 230], [1300, 700], [720, 700]]

readouts:
  - id: a6_vl
    at: { comp: puffer, port: bottom }
    label: "a6 VL"
    value_key: vl
  - id: t_solar
    at: { comp: mix1, port: top }
    label: "t SOL"
    value_key: t_solar
    side: left
  - id: p_val
    at: { comp: val1, port: stem }
    label: "p VAL"
    value_key: p_val
    side: left

labels:
  - id: legende
    at: [40, 880]
    text: "S4-L2: Mikro-Layout (R-36) — 5 Gruppen, 14 Komponenten, 13 Pipes"
    anchor: start
