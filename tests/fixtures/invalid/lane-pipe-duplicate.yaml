# S4-L5b (R-39): eine Pipe steht in 2 Lanes → exit 2
# (`lane-pipe-duplicate`).
schema: plantschema/v1
canvas: { width: 600, height: 400 }

components:
  - id: p1
    type: pump
    at: [100, 100]
  - id: h1
    type: radiator
    at: [450, 300]

pipes:
  - id: p_a
    from: { comp: p1, port: out }
    to: { comp: h1, port: in }
    kind: vl

lanes:
  - id: lane_a
    at: [60, 160]
    size: [480, 40]
    pipes: [p_a]
  - id: lane_b
    at: [60, 220]
    size: [480, 40]
    pipes: [p_a]
